      - name: policies_faq
        label: "Policies & FAQ page"
        file: "_data/pages/policies_faq.json"
        fields:
          - label: "Search result title"
            name: meta
            widget: object
            fields:
              - { label: "Title", name: title, widget: string, hint: "The blue link in Google results. About 60 characters." }
              - { label: "Description", name: description, widget: text, hint: "The grey text under the link in Google. About 155 characters." }
          - label: "Top of page"
            name: hero
            widget: object
            fields:
              - { label: "Small heading above the title", name: eyebrow, widget: string }
              - { label: "Heading", name: heading, widget: string, hint: "Keep the &amp; as it is." }
              - { label: "Paragraph", name: body, widget: text }
          - label: "Deposits"
            name: deposits
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Paragraph, part before the deposit amount", name: intro, widget: string, hint: "The deposit percent itself comes from Business info and prices, not here. Keep the trailing space, for example \"A \"." }
              - { label: "Word after the deposit amount", name: unit_word, widget: string, hint: "Shown in bold right after the deposit percent, normally deposit." }
              - { label: "Paragraph, part after the deposit amount", name: outro, widget: text }
          - label: "Cancellations & Rescheduling"
            name: cancellations
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string, hint: "Keep the &amp; as it is." }
              - { label: "Paragraph, part before the notice period", name: intro, widget: string, hint: "The notice period itself comes from Business info and prices, not here. Keep the trailing space." }
              - { label: "Text right after the notice period", name: unit_word, widget: string, hint: "Shown in bold right after the notice period, normally an apostrophe and the word notice, for example \"' notice\". No leading space." }
              - { label: "Paragraph, part after the notice period", name: outro, widget: text }
              - { label: "Less than 24 hours label", name: fee_short_label, widget: string, hint: "The fee percent itself comes from Business info and prices." }
              - { label: "Same-day label", name: fee_same_day_label, widget: string }
              - { label: "No-show label", name: fee_no_show_label, widget: string }
              - { label: "Fee line ending", name: fee_suffix, widget: string, hint: "Repeated after all three fee percents, for example \" of the service price\". Keep the leading space." }
          - label: "Late Arrivals"
            name: late_arrivals
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Paragraph", name: body, widget: text, hint: "Keep the &ndash; as it is." }
          - label: "Minors"
            name: minors
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Paragraph", name: body, widget: text }
          - label: "Health & Safety"
            name: health_safety
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string, hint: "Keep the &amp; as it is." }
              - { label: "Paragraph", name: body, widget: text, hint: "Keep the <b> and </b> tags as they are around the list of conditions." }
          - label: "Payments"
            name: payments
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Paragraph, part before the accepted payment types", name: intro, widget: string, hint: "The payment types list comes from Business info and prices, not here. Keep the trailing space, for example \"We accept \"." }
              - { label: "Paragraph, part after the accepted payment types", name: outro, widget: string, hint: "Usually just a period." }
          - label: "Upcoming Closures"
            name: upcoming_closures
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Paragraph", name: body, widget: text, required: false, hint: "Leave blank when there is no closure and this whole section disappears. Example: The studio will be closed <b>July 31 &ndash; August 2</b>. Online booking will show available times around the closure." }
          - label: "Contact line (below the policy list)"
            name: contact_line
            widget: object
            fields:
              - { label: "Part before the phone link", name: intro, widget: string, hint: "The phone number comes from Business info and prices. Keep the trailing space." }
              - { label: "Part between the phone and email links", name: mid, widget: string, hint: "Keep the spaces on both sides." }
              - { label: "Part after the email link", name: outro, widget: string, hint: "The email address comes from Business info and prices." }
          - label: "Frequently Asked Questions"
            name: faq
            widget: object
            fields:
              - { label: "Small heading above the title", name: eyebrow, widget: string }
              - { label: "Heading", name: heading, widget: string }
              - label: "Questions and answers"
                name: items
                widget: list
                label_singular: "Question"
                summary: "{{fields.question}}"
                fields:
                  - { label: "Question", name: question, widget: string }
                  - { label: "Answer", name: answer, widget: text, hint: "Shown on the page and also sent to Google as this question's answer. Keep any <b> tags as they are." }
                  - { label: "Answer for Google only (optional)", name: plain_answer, widget: text, required: false, hint: "Only fill this in if the answer above has formatting and the plain wording Google should read is different. Leave blank to let Google use the answer above with formatting removed." }

      - name: contact
        label: "Contact page"
        file: "_data/pages/contact.json"
        fields:
          - label: "Search result title"
            name: meta
            widget: object
            fields:
              - { label: "Title", name: title, widget: string, hint: "The blue link in Google results. About 60 characters." }
              - { label: "Description", name: description, widget: text, hint: "The grey text under the link in Google. About 155 characters." }
          - label: "Top of page"
            name: hero
            widget: object
            fields:
              - { label: "Small label above the heading", name: eyebrow, widget: string }
              - { label: "Heading", name: heading, widget: string, hint: "Keep the &amp; as it is, it shows as an ampersand (&)." }
              - { label: "Paragraph", name: lead, widget: text }
          - label: "Three quick-contact cards"
            name: cards
            widget: object
            fields:
              - label: "Call or text card"
                name: call
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Text", name: body, widget: text }
              - label: "Email card"
                name: email
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Text", name: body, widget: text }
              - label: "Book online card"
                name: book
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Text", name: body, widget: text }
                  - { label: "Button text", name: cta, widget: string }
          - label: "Message form"
            name: message
            widget: object
            fields:
              - { label: "Small label above the heading", name: eyebrow, widget: string }
              - { label: "Heading", name: heading, widget: string }
              - { label: "Name field label", name: label_name, widget: string }
              - { label: "Email field label", name: label_email, widget: string }
              - { label: "Phone field label", name: label_phone, widget: string }
              - { label: "Message field label", name: label_message, widget: string }
              - { label: "Submit button text", name: submit, widget: string }
          - label: "Visit the Studio section"
            name: visit
            widget: object
            fields:
              - { label: "Small label above the heading", name: eyebrow, widget: string }
              - { label: "Parking and access note", name: parking_note, widget: string, hint: "Shown right after the city, state and zip. Keep the &middot; as it is." }
              - { label: "Map accessibility title", name: map_title, widget: string, hint: "Not usually visible, read by screen readers for the map." }
              - { label: "Directions tooltip", name: directions_tooltip, widget: string, hint: "The small popup text on the Get Directions button." }
              - { label: "Directions button text", name: directions_cta, widget: string }
              - label: "Hours"
                name: hours
                widget: object
                fields:
                  - { label: "Small label above the hours", name: eyebrow, widget: string }
                  - { label: "Monday label", name: monday_label, widget: string }
                  - { label: "Tuesday label", name: tuesday_label, widget: string }
                  - { label: "Wednesday label", name: wednesday_label, widget: string }
                  - { label: "Thursday label", name: thursday_label, widget: string }
                  - { label: "Friday label", name: friday_label, widget: string }
                  - { label: "Saturday label", name: saturday_label, widget: string }
                  - { label: "Sunday label", name: sunday_label, widget: string }
              - { label: "Closure notice", name: notice, widget: text, required: false, hint: "Shown under the hours. Leave blank when there is no closure and the line disappears. When you add one, also update the closure notice in Business info and prices and the Upcoming Closures section on the Policies page." }
          - label: "Contact form status messages"
            name: form_feedback
            widget: object
            fields:
              - { label: "Sending message", name: sending, widget: string, hint: "Shown for a moment while the form submits." }
              - { label: "Success message", name: success, widget: string }
              - { label: "Error message", name: error, widget: string, hint: "Shown if the form fails to send. Leave {{PHONE}} exactly as it is, do not type a phone number there. The page fills it in automatically from the phone number in Business info and prices." }

