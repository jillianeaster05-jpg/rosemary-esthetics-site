# Rosemary Esthetics: content editor configuration (Sveltia CMS).
# Maps the visual editor onto the site's content files. Jillian edits friendly
# fields here; the CMS commits the changes back to _data/site.json and the
# per-page files under _data/pages/, and the site rebuilds automatically.
#
# Source of truth: this site will live in Jillian's own GitHub repo. The CMS
# commits edits straight back to it. Login is GitHub OAuth handled by Jillian's
# own sveltia-cms-auth worker on Cloudflare (base_url below), so there is no
# dependency on Netlify's deprecated Git Gateway and nothing is locked to the
# studio.
#
# repo and base_url below are PLACEHOLDERS. Jillian's GitHub account and her
# Cloudflare worker are not set up yet. SVELTIA-SWITCH-CHECKLIST.md (in
# 09 - Website) walks through creating both and fills in the real values here.

backend:
  name: github
  repo: JILLIAN-GITHUB-USERNAME/rosemary-esthetics-site   # PLACEHOLDER, see SVELTIA-SWITCH-CHECKLIST.md
  branch: main
  base_url: https://sveltia-cms-auth.JILLIAN-CLOUDFLARE-SUBDOMAIN.workers.dev   # PLACEHOLDER, see SVELTIA-SWITCH-CHECKLIST.md

site_url: https://rosemaryestheticsidaho.com
display_url: https://rosemaryestheticsidaho.com
publish_mode: simple

# Where an uploaded photo would be stored. Jillian can add photos later from
# the same editor.
media_folder: "img/uploads"
public_folder: "/img/uploads"

collections:
  # ---- Business info and prices (one editable document) ----
  - name: business
    label: "Business info and prices"
    delete: false
    editor:
      preview: false
    files:
      - name: site
        label: "Business info and prices"
        file: "_data/site.json"
        fields:
          - label: "Business"
            name: business
            widget: object
            hint: "Shows in the header, in search results, and in the site's business listing."
            fields:
              - { label: "Business name", name: name, widget: string }
              - { label: "Tagline", name: tagline, widget: string, hint: "Short line under the business name, e.g. on the homepage." }
              - { label: "Owner name", name: owner_name, widget: string }
              - { label: "Owner title", name: owner_title, widget: string, hint: "e.g. Licensed Esthetician" }
          - label: "Contact"
            name: contact
            widget: object
            fields:
              - { label: "Phone (shown to people)", name: phone_display, widget: string, hint: "How the phone number is printed on the site, e.g. (208) 521-0938." }
              - { label: "Phone (for click-to-call links)", name: phone_e164, widget: string, hint: "Format only, do not change the number itself without also updating Phone (shown to people) to match: a plus sign, the country code, then the digits with no spaces, dashes or parentheses. Example: +12085210938." }
              - { label: "Phone note", name: phone_note, widget: string, hint: "Short note next to the phone number, e.g. call or text." }
              - { label: "Email", name: email, widget: string }
              - { label: "Booking link", name: booking_url, widget: string, hint: "The Square booking page people land on when they click Book Now." }
          - label: "Address"
            name: address
            widget: object
            fields:
              - { label: "Street", name: street, widget: string }
              - { label: "City", name: city, widget: string }
              - { label: "State", name: region, widget: string }
              - { label: "ZIP code", name: postal_code, widget: string }
          - label: "Hours"
            name: hours
            widget: object
            fields:
              - { label: "Hours (shown as one line)", name: display, widget: string, hint: "The short summary line shown on the site, e.g. Mon & Thu 9-6, Wed 3-8, Fri 9-2, Sat 9-9, Closed Sun & Tue. Keep this in sync with the day-by-day hours below." }
              - { label: "Monday", name: monday, widget: string, hint: "e.g. 9:00-6:00, or Closed" }
              - { label: "Tuesday", name: tuesday, widget: string, hint: "e.g. 9:00-6:00, or Closed" }
              - { label: "Wednesday", name: wednesday, widget: string, hint: "e.g. 9:00-6:00, or Closed" }
              - { label: "Thursday", name: thursday, widget: string, hint: "e.g. 9:00-6:00, or Closed" }
              - { label: "Friday", name: friday, widget: string, hint: "e.g. 9:00-6:00, or Closed" }
              - { label: "Saturday", name: saturday, widget: string, hint: "e.g. 9:00-6:00, or Closed" }
              - { label: "Sunday", name: sunday, widget: string, hint: "e.g. 9:00-6:00, or Closed" }
          - label: "Social links"
            name: social
            widget: object
            fields:
              - { label: "Instagram URL", name: instagram, widget: string }
              - { label: "TikTok URL", name: tiktok, widget: string }
              - { label: "Facebook URL", name: facebook, widget: string }
              - { label: "Google review link", name: google_review, widget: string, hint: "The direct link that opens the Google review box." }
          - label: "Policies"
            name: policies
            widget: object
            fields:
              - { label: "Deposit percent", name: deposit_pct, widget: string, hint: "e.g. 20%" }
              - { label: "Cancellation notice", name: cancellation_notice, widget: string, hint: "e.g. 24 hours" }
              - { label: "Late cancellation fee", name: fee_short_notice, widget: string, hint: "e.g. 50%" }
              - { label: "Same-day cancellation fee", name: fee_same_day, widget: string, hint: "e.g. 75%" }
              - { label: "No-show fee", name: fee_no_show, widget: string, hint: "e.g. 100%" }
          - label: "Announcement"
            name: announcement
            widget: object
            fields:
              - { label: "Closure notice", name: closure_notice, widget: string, required: false, hint: "A short note shown on the site about an upcoming closure, e.g. the studio will be closed July 31 - August 2, 2026. Leave blank when there is no closure to announce." }
          - { label: "Payments accepted", name: payments, widget: string, hint: "Plain text list shown on the site, e.g. Cash, Venmo, Credit Card, Debit Card, Apple Pay, Google Pay." }
          - label: "Services and prices"
            name: services
            widget: object
            hint: "Prices and durations here must match Square exactly. Square is the source of truth: check the Square booking menu before changing a price, and if the site and Square ever disagree, fix this to match Square."
            fields:
              - label: "Facials"
                name: facials
                widget: list
                label_singular: "service"
                summary: "{{fields.name}} - {{fields.price}}"
                fields:
                  - { label: "Name", name: name, widget: string }
                  - { label: "Price", name: price, widget: string, hint: "Match Square exactly, including the dollar sign, e.g. $80." }
                  - { label: "Duration", name: duration, widget: string, required: false, hint: "e.g. 1h15 or 30m. Leave blank if this item has no set duration in Square." }
              - label: "Lashes"
                name: lashes
                widget: list
                label_singular: "service"
                summary: "{{fields.name}} - {{fields.price}}"
                fields:
                  - { label: "Name", name: name, widget: string }
                  - { label: "Price", name: price, widget: string, hint: "Match Square exactly, including the dollar sign, e.g. $55." }
                  - { label: "Duration", name: duration, widget: string, required: false, hint: "e.g. 1h15 or 30m. Leave blank if this item has no set duration in Square." }
              - label: "Brows"
                name: brows
                widget: list
                label_singular: "service"
                summary: "{{fields.name}} - {{fields.price}}"
                fields:
                  - { label: "Name", name: name, widget: string }
                  - { label: "Price", name: price, widget: string, hint: "Match Square exactly, including the dollar sign, e.g. $55." }
                  - { label: "Duration", name: duration, widget: string, required: false, hint: "e.g. 1h15 or 30m. Leave blank if this item has no set duration in Square." }
              - label: "Waxing"
                name: waxing
                widget: list
                label_singular: "service"
                summary: "{{fields.name}} - {{fields.price}}"
                fields:
                  - { label: "Name", name: name, widget: string }
                  - { label: "Price", name: price, widget: string, hint: "Match Square exactly, including the dollar sign, e.g. $20." }
                  - { label: "Duration", name: duration, widget: string, required: false, hint: "e.g. 1h15 or 30m. Leave blank if this item has no set duration in Square." }
              - label: "Back treatments"
                name: back
                widget: list
                label_singular: "service"
                summary: "{{fields.name}} - {{fields.price}}"
                fields:
                  - { label: "Name", name: name, widget: string }
                  - { label: "Price", name: price, widget: string, hint: "Match Square exactly, including the dollar sign, e.g. $85." }
                  - { label: "Duration", name: duration, widget: string, required: false, hint: "e.g. 1h15 or 30m. Leave blank if this item has no set duration in Square." }
              - label: "LED light therapy"
                name: led
                widget: list
                label_singular: "service"
                summary: "{{fields.name}} - {{fields.price}}"
                fields:
                  - { label: "Name", name: name, widget: string }
                  - { label: "Price", name: price, widget: string, hint: "Match Square exactly, including the dollar sign, e.g. $5." }
                  - { label: "Duration", name: duration, widget: string, required: false, hint: "e.g. 1h15 or 30m. Leave blank if this item has no set duration in Square." }
              - label: "Add-ons"
                name: addons
                widget: list
                label_singular: "add-on"
                summary: "{{fields.name}} - {{fields.price}}"
                fields:
                  - { label: "Name", name: name, widget: string }
                  - { label: "Price", name: price, widget: string, hint: "Match Square exactly, including the dollar sign, e.g. $5." }
                  - { label: "Duration", name: duration, widget: string, required: false, hint: "e.g. 1h15 or 30m. Leave blank if this item has no set duration in Square." }

  # ---- Pages (one entry per page, pasted in by the studio) ----
  - name: pages
    label: "Pages"
    delete: false
    editor:
      preview: false
    files:
      - name: shared
        label: "Header, footer and booking box (every page)"
        file: "_data/pages/shared.json"
        fields:
          - label: "Top navigation menu"
            name: nav
            widget: object
            fields:
              - { label: "Skip-to-content link (screen readers only)", name: skip_text, widget: string, hint: "Not seen by most visitors. Leave as is unless asked to change it." }
              - { label: "Mobile menu button", name: menu_text, widget: string, hint: "The word on the menu button on phones." }
              - { label: "Home link", name: home, widget: string }
              - { label: "Services link", name: services, widget: string }
              - { label: "Gallery link", name: gallery, widget: string }
              - { label: "About link", name: about, widget: string }
              - { label: "Policies link", name: policies, widget: string }
              - { label: "Contact link", name: contact, widget: string }
              - { label: "Book Now button", name: book_now, widget: string, hint: "Used in the top menu, the footer, and the phone bottom bar. One change updates all three." }
          - label: "Footer (extra links and bottom lines)"
            name: footer
            widget: object
            fields:
              - { label: "Reviews link", name: reviews, widget: string }
              - { label: "Find Your Treatment link", name: find_your_treatment, widget: string }
              - { label: "Policies & FAQ link", name: policies_faq, widget: string }
              - { label: "Privacy link", name: privacy, widget: string }
              - { label: "Instagram link text", name: instagram, widget: string }
              - { label: "TikTok link text", name: tiktok, widget: string }
              - { label: "Facebook link text", name: facebook, widget: string }
              - { label: "Copyright year", name: copyright_year, widget: string, hint: "The year shown next to the copyright symbol at the very bottom of every page. Update each January." }
              - { label: "Copyright state name", name: copyright_state, widget: string, hint: "Spelled-out state name shown at the very bottom of every page, for example Idaho." }
          - label: "Phone bottom bar (mobile only)"
            name: mobile_bar
            widget: object
            fields:
              - { label: "Call button", name: call_text, widget: string, hint: "Shown only on phones, next to Book Now." }
          - label: "Booking box (bottom of every page)"
            name: book_cta
            widget: object
            fields:
              - { label: "Small heading above the title", name: eyebrow, widget: string, hint: "Can be overridden on individual pages; this is the default." }
              - { label: "Heading", name: heading, widget: string }
              - { label: "Paragraph, part before the deposit amount", name: paragraph_intro, widget: string, hint: "The deposit percent itself comes from Business info and prices, not here. Keep the trailing space." }
              - { label: "Word after the deposit amount", name: paragraph_unit_word, widget: string, hint: "The single word right after the deposit percent, normally deposit." }
              - { label: "Paragraph, part after the deposit amount", name: paragraph_outro, widget: text, hint: "Keep the leading space." }
              - { label: "Location label", name: location_label, widget: string, hint: "Bold word above the address." }
              - { label: "Hours label", name: hours_label, widget: string, hint: "Bold word above the hours." }
              - { label: "Contact label", name: contact_label, widget: string, hint: "Bold word above the phone and email." }
              - { label: "Book button text", name: button_text, widget: string }
              - { label: "Notice line prefix", name: notice_prefix, widget: string, hint: "Comes right before the closure notice from Business info and prices. Keep the trailing space, for example \"Please note: \"." }

      - name: home
        label: "Home page"
        file: "_data/pages/home.json"
        fields:
          - label: "Search result title"
            name: meta
            widget: object
            fields:
              - { label: "Title", name: title, widget: string, hint: "The blue link in Google results. About 60 characters." }
              - { label: "Description", name: description, widget: text, hint: "The grey text under the link in Google. About 155 characters." }
          - label: "Top of page (hero)"
            name: hero
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string, hint: "Keep the &nbsp; between the two words as it is. It keeps the name on one line." }
              - { label: "Paragraph", name: lead, widget: text, hint: "Keep the <b> tags as they are." }
              - { label: "Book button text", name: cta_book, widget: string }
              - { label: "View services button text", name: cta_services, widget: string }
              - { label: "Trust line, part 1", name: trust_1, widget: string }
              - { label: "Trust line, part 2", name: trust_2, widget: string }
              - { label: "Trust line, part 3", name: trust_3, widget: string }
              - { label: "Hero photo description (for screen readers)", name: image_alt, widget: string }
          - label: "Scrolling word banner"
            name: band_items
            widget: list
            label_singular: "Word"
            summary: "{{fields.value}}"
            field: { name: value, widget: string, label: "Word" }
          - label: "Treatments and Pricing section"
            name: services
            widget: object
            fields:
              - { label: "Small label above heading", name: eyebrow, widget: string }
              - { label: "Heading", name: heading, widget: string, hint: "Keep the &amp; as it is." }
              - { label: "Paragraph", name: intro, widget: text }
              - label: "Facials card"
                name: facials
                widget: object
                fields:
                  - { label: "Small badge text", name: tag, widget: string }
                  - { label: "Card heading", name: heading, widget: string }
                  - { label: "Card description", name: desc, widget: text }
                  - { label: "Tooltip on the dermaplane facial row", name: row1_tooltip, widget: text, hint: "Shown when a visitor hovers or taps the second facial's name." }
                  - { label: "Link text to facial details page", name: link_text, widget: string, hint: "Keep the &rarr; as it is." }
                  - { label: "Facial photo description (for screen readers)", name: image_alt, widget: string }
              - label: "Lashes card"
                name: lashes
                widget: object
                fields:
                  - { label: "Card heading", name: heading, widget: string }
                  - { label: "Tooltip on the eyelash lift row", name: row1_tooltip, widget: text, hint: "Shown when a visitor hovers or taps the lash lift name." }
                  - { label: "Link text to lash details page", name: link_text, widget: string, hint: "Keep the &rarr; as it is." }
              - label: "Brows card"
                name: brows
                widget: object
                fields:
                  - { label: "Card heading", name: heading, widget: string }
                  - { label: "Tooltip on the brow lamination row", name: row1_tooltip, widget: text, hint: "Shown when a visitor hovers or taps the brow lamination name." }
                  - { label: "Link text to brow details page", name: link_text, widget: string, hint: "Keep the &rarr; as it is." }
              - label: "Waxing card"
                name: waxing
                widget: object
                fields:
                  - { label: "Card heading", name: heading, widget: string }
                  - { label: "Third row name", name: row2_name, widget: string, hint: "This row covers both the Lip and the Chin wax, which share a price. It is typed in here, not pulled from the price list." }
                  - { label: "Link text to waxing details page", name: link_text, widget: string, hint: "Keep the &rarr; as it is." }
              - label: "Back treatments card"
                name: back
                widget: object
                fields:
                  - { label: "Card heading", name: heading, widget: string }
                  - { label: "Link text to back treatment details page", name: link_text, widget: string, hint: "Keep the &rarr; as it is." }
              - label: "LED light therapy card"
                name: led
                widget: object
                fields:
                  - { label: "New badge text", name: tag_new, widget: string }
                  - { label: "New badge tooltip", name: tag_new_tooltip, widget: text }
                  - { label: "Card heading", name: heading, widget: string }
                  - { label: "Description, before the price", name: desc_before, widget: text, hint: "The price itself is pulled from the price list automatically." }
                  - { label: "Description, after the price", name: desc_after, widget: text }
                  - { label: "Link text to LED details page", name: link_text, widget: string, hint: "Keep the &rarr; as it is." }
              - { label: "Book Your Visit button text", name: book_cta, widget: string }
              - { label: "Quiz prompt, before the link", name: quiz_prompt, widget: string }
              - { label: "Quiz link text", name: quiz_link_text, widget: string }
          - label: "Skincare Experience section"
            name: experience
            widget: object
            fields:
              - { label: "Small label above heading", name: eyebrow, widget: string }
              - { label: "Heading", name: heading, widget: string }
              - { label: "Card 1 heading", name: vp1_heading, widget: string }
              - { label: "Card 1 body", name: vp1_body, widget: text }
              - { label: "Card 2 heading", name: vp2_heading, widget: string }
              - { label: "Card 2 body", name: vp2_body, widget: text }
              - { label: "Card 3 heading", name: vp3_heading, widget: string }
              - { label: "Card 3 body, before the deposit amount", name: vp3_body_before, widget: text, hint: "The deposit percentage is pulled in automatically." }
              - { label: "Card 3 tooltip on the deposit amount", name: vp3_tooltip, widget: text }
              - { label: "Card 3 body, right after the deposit amount", name: vp3_body_after, widget: string, hint: "Usually just the word deposit with a leading space." }
              - { label: "Card 3 body, to the end", name: vp3_body_end, widget: text }
          - label: "Meet Jillian section"
            name: intro
            widget: object
            fields:
              - { label: "Small label above heading", name: eyebrow, widget: string }
              - { label: "Heading", name: heading, widget: string }
              - { label: "Paragraph 1", name: para1, widget: text }
              - { label: "Paragraph 2", name: para2, widget: text }
              - { label: "Link text to the About page", name: link_text, widget: string }
              - { label: "Jillian photo description (for screen readers)", name: image_alt, widget: string }
              - { label: "Signature text", name: signature, widget: string }
          - label: "Studio photos section"
            name: studio
            widget: object
            fields:
              - { label: "Small label above heading", name: eyebrow, widget: string }
              - { label: "Heading", name: heading, widget: string }
              - { label: "Photo 1 description (for screen readers)", name: image1_alt, widget: string }
              - { label: "Photo 2 description (for screen readers)", name: image2_alt, widget: string }
              - { label: "Photo 3 description (for screen readers)", name: image3_alt, widget: string }
              - { label: "Link text to the gallery page", name: link_text, widget: string }
          - label: "Follow Along (Instagram) section"
            name: social
            widget: object
            fields:
              - { label: "Small label above heading", name: eyebrow, widget: string }
              - { label: "Heading", name: heading, widget: string }
              - { label: "Paragraph, before the Instagram link", name: body_before, widget: text }
              - { label: "Instagram link text", name: instagram_link_text, widget: string }
              - { label: "Paragraph, between the two links", name: body_middle, widget: text }
              - { label: "Google review link text", name: review_link_text, widget: string }
              - { label: "Paragraph, after the review link", name: body_after, widget: string, hint: "Usually just a period." }
              - { label: "Instagram button text", name: btn_instagram, widget: string }
              - { label: "Google review button text", name: btn_review, widget: string }

      - name: about
        label: "About page"
        file: "_data/pages/about.json"
        fields:
          - label: "Search result title"
            name: meta
            widget: object
            fields:
              - { label: "Title", name: title, widget: string, hint: "The blue link in Google results. About 60 characters." }
              - { label: "Description", name: description, widget: text, hint: "The grey text under the link in Google. About 155 characters." }
          - label: "Top of page (hero)"
            name: hero
            widget: object
            fields:
              - { label: "Small label above heading", name: eyebrow, widget: string }
              - { label: "Heading", name: heading, widget: string }
              - { label: "Paragraph", name: lead, widget: text }
          - label: "My Story section"
            name: story
            widget: object
            fields:
              - { label: "Jillian photo description (for screen readers)", name: image_alt, widget: string }
              - { label: "Small label above heading", name: eyebrow, widget: string }
              - { label: "Heading", name: heading, widget: string }
              - { label: "Paragraph 1", name: para1, widget: text }
              - { label: "Paragraph 2", name: para2, widget: text }
              - { label: "Paragraph 3", name: para3, widget: text }
              - { label: "Paragraph 4", name: para4, widget: text }
              - { label: "Signature text", name: signature, widget: string }
          - label: "Credentials section"
            name: credentials
            widget: object
            fields:
              - { label: "Small label above heading", name: eyebrow, widget: string }
              - { label: "Heading", name: heading, widget: string, hint: "Keep the &amp; as it is." }
              - label: "Credential list"
                name: items
                widget: list
                label_singular: "Credential"
                summary: "{{fields.value}}"
                field: { name: value, widget: string, label: "Credential", hint: "Keep any <b> tags and &amp; as they are." }
              - { label: "Second photo description (for screen readers)", name: image_alt, widget: string }
          - label: "Comfortable for Everyone section"
            name: studio
            widget: object
            fields:
              - { label: "Small label above heading", name: eyebrow, widget: string }
              - { label: "Heading", name: heading, widget: string }
              - { label: "Intro paragraph, before the street address", name: intro_before, widget: string, hint: "The street address is pulled in automatically." }
              - { label: "Intro paragraph, after the street address", name: intro_after, widget: string }
              - { label: "Card 1 heading", name: vp1_heading, widget: string }
              - { label: "Card 1 body", name: vp1_body, widget: text }
              - { label: "Card 2 heading", name: vp2_heading, widget: string }
              - { label: "Card 2 body", name: vp2_body, widget: text }
              - { label: "Book button text", name: cta, widget: string }

      - name: services
        label: "Services page (hub)"
        file: "_data/pages/services.json"
        fields:
          - label: "Search result title"
            name: meta
            widget: object
            fields:
              - { label: "Title", name: title, widget: string, hint: "The blue link in Google results. About 60 characters." }
              - { label: "Description", name: description, widget: text, hint: "The grey text under the link in Google. About 155 characters." }
          - label: "Top of page"
            name: hero
            widget: object
            fields:
              - { label: "Small label above the heading", name: eyebrow, widget: string }
              - { label: "Heading", name: heading, widget: string, hint: "Keep the &amp; entity as it is." }
              - { label: "Paragraph, part before the deposit amount", name: lead_before, widget: text, hint: "The deposit percentage itself is filled in automatically after this text and before the next field." }
              - { label: "Paragraph, part after the deposit amount", name: lead_after, widget: text }
              - { label: "Book button text", name: cta_book, widget: string }
              - { label: "Find Your Treatment button text", name: cta_find, widget: string }
          - label: "Service category sections"
            name: services
            widget: object
            fields:
              - { label: "Read more link text (used on every category)", name: more_text, widget: string, hint: "Keep the &amp; and &rarr; entities as they are." }
              - label: "Facials section"
                name: facials
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Short description", name: body, widget: text }
              - label: "Lashes section"
                name: lashes
                widget: object
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Short description", name: body, widget: text }
              - label: "Brows section"
                name: brows
                widget: object
