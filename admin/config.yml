      - name: find_your_treatment
        label: "Find Your Treatment quiz page"
        file: "_data/pages/find_your_treatment.json"
        fields:
          - label: "Search result title"
            name: meta
            widget: object
            fields:
              - { label: "Title", name: title, widget: string, hint: "The blue link in Google results. About 60 characters." }
              - { label: "Description", name: description, widget: text, hint: "The grey text under the link in Google. About 155 characters." }
          - label: "Top of page"
            name: hero
            widget: object
            fields:
              - { label: "Small label above the heading", name: eyebrow, widget: string }
              - { label: "Heading", name: heading, widget: string }
              - { label: "Paragraph", name: lead, widget: text }
          - label: "Quiz"
            name: quiz
            widget: object
            fields:
              - label: "The three questions"
                name: questions
                widget: list
                label_singular: "question"
                summary: "{{fields.prompt}}"
                hint: "There must always be exactly three questions, in this order. Do not add, remove, or reorder them, the quiz logic behind the scenes expects exactly these three in this order."
                fields:
                  - { label: "Question counter text", name: qnum, widget: string, hint: "For example Question 1 of 3." }
                  - { label: "Question text", name: prompt, widget: string }
                  - label: "Answer choices"
                    name: options
                    widget: list
                    label_singular: "answer"
                    hint: "Do not add, remove, or reorder answer choices, each one is wired to a specific result behind the scenes. You can fix the wording of an existing choice."
                    field: { label: "Answer text", name: option, widget: string }
              - { label: "Submit button text", name: button_label, widget: string }
              - { label: "Error message", name: error_message, widget: string, hint: "Shown if someone tries to submit without answering all three questions." }
              - label: "Result card wording"
                name: result_card
                widget: object
                fields:
                  - { label: "Small label above the result name", name: eyebrow, widget: string }
                  - { label: "Book button text", name: book_cta, widget: string }
                  - { label: "Learn more button text", name: learn_more, widget: string }
                  - { label: "Compare label", name: compare_label, widget: string, hint: "The text right before the See the full menu link. Keep the trailing space." }
                  - { label: "See the full menu link text", name: compare_link, widget: string }
                  - { label: "Middle connector text", name: compare_middle, widget: string, hint: "The small word between the two links, for example or. Keep the spaces around it." }
                  - { label: "Retake the quiz link text", name: retake_link, widget: string }
              - { label: "Extra note when the goal is clearer, calmer skin", name: extra_clear_goal, widget: string, hint: "Added to the end of the result's why-text whenever someone picks Clearer, calmer skin as their goal. Keep the leading space." }
              - label: "Results"
                name: results
                widget: object
                hint: "These are the thirteen possible quiz outcomes. Each one is matched by the quiz logic behind the scenes using its field name, so do not rename, add, or remove any of the thirteen results below. You can freely edit the name, price and time, and why-text of each one. Every price and time here must match what is actually charged in Square, since these are typed in separately from the price list on the service pages."
                fields:
                  - label: "Back area, goal clearer calmer skin"
                    name: back_clear
                    widget: object
                    fields:
