      - name: privacy
        label: "Privacy page"
        file: "_data/pages/privacy.json"
        fields:
          - label: "Search result title"
            name: meta
            widget: object
            fields:
              - { label: "Title", name: title, widget: string, hint: "The blue link in Google results. About 60 characters." }
              - { label: "Description", name: description, widget: text, hint: "The grey text under the link in Google. About 155 characters." }
          - label: "Top of page"
            name: hero
            widget: object
            fields:
              - { label: "Small heading above the title", name: eyebrow, widget: string }
              - { label: "Heading", name: heading, widget: string }
              - { label: "Paragraph", name: body, widget: text }
          - label: "What we collect"
            name: collect
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Paragraph", name: body, widget: text }
          - label: "Booking"
            name: booking
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Paragraph, part before the link", name: intro, widget: text, hint: "Keep the trailing space." }
              - { label: "Link text", name: link_text, widget: string, hint: "The clickable words. The link itself goes to Square's privacy policy and stays in the template." }
              - { label: "Paragraph, part after the link", name: outro, widget: text }
          - label: "Cookies and analytics"
            name: cookies
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string, hint: "Keep the &amp; as it is." }
              - { label: "Paragraph", name: body, widget: text }
          - label: "Your choices"
            name: choices
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Paragraph, part before the email link", name: intro, widget: text, hint: "Keep the trailing space. Ends right before the email address, which comes from Business Facts." }
              - { label: "Paragraph, part between the email and phone links", name: mid, widget: string, hint: "Keep the spaces on both sides." }
              - { label: "Paragraph, part after the phone link", name: outro, widget: text }
          - label: "Effective-date line"
            name: effective_date_line
            widget: string
            hint: "Shown at the very bottom of the page, before the business address. For example \"Effective July 2, 2026\". Update this whenever the privacy policy changes."
